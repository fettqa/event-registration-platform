<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Event details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="page">
  <div class="topbar">
    <div class="event-heading">
      <h1 data-testid="event-title" th:text="${event.name()}">Event</h1>
      <div class="meta">
        <span class="meta-item">
          Max seats: <strong data-testid="event-seats" th:text="${event.maxSeats()}"></strong>
        </span>
        <span class="meta-item">
          Seats left: <strong data-testid="seats-left" th:text="${seatsLeft}"></strong>
        </span>
      </div>
    </div>
    <div class="actions">
      <button type="button"
              class="btn btn-danger"
              data-testid="delete-event-button"
              th:attr="data-event-id=${event.id()},data-created-by-email=${event.createdByEmail()}"
              hidden>Delete event</button>
      <a class="btn btn-secondary" href="/" data-testid="back-to-list">Back to list</a>
    </div>
  </div>

  <div th:if="${justRegistered}" class="alert alert-success" data-testid="success-message">
    Registration successful
  </div>
  <div class="alert alert-error" data-testid="error-message" hidden></div>

  <div class="card register-card" data-testid="register-section">
    <h2>Register</h2>

    <div data-testid="register-guest" hidden>
      <p class="muted">Guests can browse events. Sign in to register.</p>
      <a class="btn" th:href="@{/login(redirect=${'/events/' + event.id()})}"
         data-testid="register-login-link">Login to register</a>
    </div>

    <div data-testid="register-user" hidden>
      <p class="muted">
        You will register as
        <strong data-testid="register-as-name"></strong>
        (<span data-testid="register-as-email"></span>).
      </p>
      <div class="actions">
        <button type="button" class="btn" data-testid="submit-registration"
                th:attr="data-event-id=${event.id()}">Register</button>
      </div>
    </div>
  </div>

  <div class="card registrations-card" data-testid="registrations-section">
    <h2>Registrations
      <span class="muted"
            th:text="|(${registeredCount})|"></span>
    </h2>

    <form class="filter-bar" method="get"
          th:action="@{/events/{id}(id=${event.id()})}"
          data-testid="registrations-filter">
      <input type="search"
             name="q"
             th:value="${q}"
             placeholder="Search by registrant name"
             data-testid="registrations-search-input"/>
      <button type="submit" class="btn" data-testid="registrations-search-submit">Search</button>
      <a class="btn btn-secondary"
         th:href="@{/events/{id}(id=${event.id()})}"
         th:if="${q != null and !q.isEmpty()}">Clear</a>
    </form>

    <div class="table-wrap">
      <table data-testid="registrations-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${registrations.totalElements == 0}">
          <td colspan="4" class="empty">No registrations found.</td>
        </tr>
        <tr th:each="r : ${registrations.content}"
            th:attr="data-testid=|registration-row-${r.id()}|">
          <td th:text="${r.id()}"></td>
          <td th:text="${r.fullName()}"></td>
          <td th:text="${r.email()}"></td>
          <td>
            <button type="button"
                    class="btn btn-secondary btn-small"
                    data-testid="delete-registration-button"
                    th:attr="data-event-id=${event.id()},data-registration-id=${r.id()},data-registration-email=${r.email()},data-created-by-email=${event.createdByEmail()}"
                    hidden>Delete</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" th:if="${registrations.totalPages > 1}"
         data-testid="registrations-pagination">
      <a class="btn btn-secondary"
         th:if="${registrations.hasPrevious()}"
         th:href="@{/events/{id}(id=${event.id()}, page=${registrations.number - 1}, q=${q})}">Previous</a>
      <span class="pagination-info"
            th:text="|Page ${registrations.number + 1} of ${registrations.totalPages} (${registrations.totalElements} total)|"></span>
      <a class="btn btn-secondary"
         th:if="${registrations.hasNext()}"
         th:href="@{/events/{id}(id=${event.id()}, page=${registrations.number + 1}, q=${q})}">Next</a>
    </div>
  </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
