<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="page">
  <div class="topbar">
    <h1>Login</h1>
    <a class="btn btn-secondary" href="/">Back</a>
  </div>

  <div class="card">
    <p class="muted login-hint">
      Seeded admin: <code>admin@example.com</code> / <code>admin123</code>.
      No account yet? <a href="/register" data-testid="go-to-register">Register</a>
      (USER cannot create events).
    </p>

    <div class="alert alert-error" data-testid="login-error" hidden></div>

    <form class="form-stack" data-testid="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required
               data-testid="login-email-input"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required
               data-testid="login-password-input"/>
      </div>

      <div class="actions">
        <button type="submit" data-testid="login-submit">Sign in</button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
