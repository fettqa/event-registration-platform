# Activate with kafka: --spring.profiles.active=kafka,mail
# SMTP target: Mailpit (docker compose) — UI http://localhost:8025
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  mail:
    from: ${MAIL_FROM:noreply@events.local}
