plugins {
    id 'java'
}

group = 'com.fettqa.events'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    allureVersion = '2.29.1'
    aspectJVersion = '1.9.22'
    cucumberVersion = '7.20.1'
}

repositories {
    mavenCentral()
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'com.microsoft.playwright:playwright:1.49.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-suite-api:1.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-suite-engine:1.11.4'
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation 'io.qameta.allure:allure-junit5'
    testImplementation 'io.qameta.allure:allure-cucumber7-jvm'

    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.register('installPlaywright', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', 'chromium']
    environment 'PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT',
            System.getenv('PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT') ?: '600000'
}

def configureAllureAndCucumber = { Test t ->
    t.dependsOn('installPlaywright')
    t.useJUnitPlatform()
    t.jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
    // Absolute path so AllureCucumber7Jvm and allure-junit5 write to the same folder.
    t.systemProperty 'allure.results.directory',
            layout.buildDirectory.dir('allure-results').get().asFile.absolutePath
    t.systemProperty 'baseUrl', System.getProperty('baseUrl', 'http://localhost:8080')
    t.systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
    t.systemProperty 'cucumber.plugin',
            'pretty, summary, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm'
}

tasks.named('test') {
    configureAllureAndCucumber(it)
    dependsOn('installPlaywright')
    useJUnitPlatform {
        excludeTags 'mobile_chrome'
    }
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
    systemProperty 'baseUrl', System.getProperty('baseUrl', 'http://localhost:8080')

}

tasks.register('cucumber', Test) {
    description = 'Run Cucumber BDD scenarios only (not classic *E2ETest)'
    group = 'verification'
    // Required for a custom Test task — otherwise Gradle reports NO-SOURCE and skips.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    configureAllureAndCucumber(it)
    filter {
        includeTestsMatching 'com.fettqa.events.e2e.cucumber.RunCucumberTest'
    }
}

tasks.register('mobileChromeTest', Test) {
    description = 'Mobile Chrome smoke (Playwright Pixel 7 device profile)'
    group = 'verification'
    dependsOn('installPlaywright')
    useJUnitPlatform {
        includeTags 'mobile_chrome'
    }
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
    systemProperty 'baseUrl', System.getProperty('baseUrl', 'http://localhost:8080')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
