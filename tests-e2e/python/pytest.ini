[pytest]
testpaths = functional
python_files = test_*.py
pythonpath = .
addopts = -v --browser chromium --alluredir=allure-results
markers =
    mail: needs Mailpit + app profiles kafka,mail
    smoke: critical-path smoke
    mobile_chrome: web UI on Mobile Chrome (Playwright Pixel 7 emulation)
    bdd: Gherkin scenarios (pytest-bdd)
