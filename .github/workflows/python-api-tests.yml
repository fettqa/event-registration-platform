name: Python API Tests
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-api/**'
      - '.github/workflows/python-api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-api/**'
      - '.github/workflows/python-api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests-api/requirements.txt

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x gradlew

      - name: Build app ...
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Start Kafka
        working-directory: app
        run: docker compose up -d kafka

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka is up."
              exit 0
            fi
            echo "Waiting for Kafka... ($i)"
            sleep 2
          done
          echo "Kafka failed to start."
          docker compose -f app/docker-compose.yml logs kafka || docker logs kafka || true
          exit 1

      - name: Start Spring Boot application
        working-directory: app
        env:
          SPRING_PROFILES_ACTIVE: kafka
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          echo "Starting $JAR with profiles=$SPRING_PROFILES_ACTIVE"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to start
        working-directory: app
        run: |
          echo "Waiting for the application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q UP; then
              echo "Application is up and running."
              exit 0
            fi
            echo "Waiting for application to start... ($i)"
            sleep 2
          done
          echo "Application failed to start within the expected time."
          cat app.log || true
          exit 1

      - name: Install Python dependencies
        working-directory: tests-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: tests-api
        env:
          BASE_URL: http://localhost:8080
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest

      - name: Stop Kafka
        if: always()
        working-directory: app
        run: docker compose down || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-python-api
          path: tests-api/allure-results
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        working-directory: tests-api
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npm install -g allure-commandline@2.29.0
            allure generate allure-results -o allure-report --clean
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-python-api
          path: tests-api/allure-report
          if-no-files-found: ignore

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app/app.log

  publish-allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 90
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
      queue: max
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-python-api
          path: allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure/python-api/${{ github.run_number }}
          keep_files: true

      - name: Summary
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/python-api/${{ github.run_number }}"
          echo "## Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "- [View Allure Report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
