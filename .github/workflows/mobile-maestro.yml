name: Mobile Maestro

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'tests-mobile/maestro/**'
      - 'tests-mobile/scripts/**'
      - '.github/workflows/mobile-maestro.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'tests-mobile/maestro/**'
      - 'tests-mobile/scripts/**'
      - '.github/workflows/mobile-maestro.yml'

jobs:
  maestro:
    name: Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x app/gradlew
          chmod +x android/gradlew
          chmod +x tests-mobile/scripts/ci-run-suite.sh

      - name: Build Spring Boot jar
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Start Spring Boot
        working-directory: app
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app
        working-directory: app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
              echo "App is UP"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "App failed to start"
          cat app.log || true
          exit 1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          MAESTRO_CLI_NO_ANALYTICS: 'true'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tests-mobile/scripts/ci-run-suite.sh maestro

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-maestro-logs
          path: app/app.log
          if-no-files-found: ignore

      - name: Stop Spring Boot
        if: always()
        working-directory: app
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi
