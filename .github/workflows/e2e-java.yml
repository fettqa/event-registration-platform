name: E2E Java (Playwright)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-e2e/java/**'
      - '.github/workflows/e2e-java.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-e2e/java/**'
      - '.github/workflows/e2e-java.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x gradlew

      - name: Build app
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Start Kafka and Mailpit
        working-directory: app
        run: docker compose up -d kafka mailpit

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka is up."
              exit 0
            fi
            sleep 2
          done
          docker compose -f app/docker-compose.yml logs kafka || true
          exit 1

      - name: Wait for Mailpit
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8025/api/v1/info >/dev/null; then
              echo "Mailpit is up."
              exit 0
            fi
            sleep 1
          done
          docker compose -f app/docker-compose.yml logs mailpit || true
          exit 1

      - name: Start Spring Boot
        working-directory: app
        env:
          SPRING_PROFILES_ACTIVE: kafka,mail
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          echo "Starting $JAR with profiles=$SPRING_PROFILES_ACTIVE"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app
        working-directory: app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q UP; then
              exit 0
            fi
            sleep 2
          done
          cat app.log || true
          exit 1

      - name: Make e2e gradlew executable
        working-directory: tests-e2e/java
        run: chmod +x gradlew

      - name: Install Playwright Chromium
        working-directory: tests-e2e/java
        run: ./gradlew installPlaywright

      - name: Run E2E tests
        working-directory: tests-e2e/java
        run: ./gradlew test -DbaseUrl=http://localhost:8080

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-java
          path: tests-e2e/java/build/allure-results
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        working-directory: tests-e2e/java
        run: |
          if [ -d build/allure-results ] && [ "$(ls -A build/allure-results 2>/dev/null)" ]; then
            npm install -g allure-commandline@2.29.0
            allure generate build/allure-results -o build/allure-report --clean
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-e2e-java
          path: tests-e2e/java/build/allure-report
          if-no-files-found: ignore

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-java-report
          path: |
            tests-e2e/java/build/reports/tests/test
            app/app.log

  publish-allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-e2e-java
          path: allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure/e2e-java/${{ github.run_number }}
          keep_files: true

      - name: Summary
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/e2e-java/${{ github.run_number }}"
          echo "## Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "- [View Allure Report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
