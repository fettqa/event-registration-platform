name: Mobile Appium Kotlin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'tests-mobile/kotlin/**'
      - 'tests-mobile/scripts/**'
      - '.github/workflows/mobile-appium-kotlin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'tests-mobile/kotlin/**'
      - 'tests-mobile/scripts/**'
      - '.github/workflows/mobile-appium-kotlin.yml'

jobs:
  appium-kotlin:
    name: Appium Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x app/gradlew
          chmod +x android/gradlew
          chmod +x tests-mobile/kotlin/gradlew
          chmod +x tests-mobile/scripts/ci-run-suite.sh

      - name: Build Spring Boot jar
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Start Spring Boot
        working-directory: app
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app
        working-directory: app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
              echo "App is UP"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          echo "App failed to start"
          cat app.log || true
          exit 1

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium
        run: |
          appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          echo $! > appium.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4723/status | grep -q ready; then
              echo "Appium is ready"
              exit 0
            fi
            echo "Waiting for Appium... ($i)"
            sleep 2
          done
          echo "Appium failed to start"
          cat appium.log || true
          exit 1

      - name: Run Appium Kotlin on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          APPIUM_URL: http://127.0.0.1:4723
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tests-mobile/scripts/ci-run-suite.sh kotlin

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile-kotlin
          path: tests-mobile/kotlin/build/allure-results
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        working-directory: tests-mobile/kotlin
        run: |
          if [ -d build/allure-results ] && [ "$(ls -A build/allure-results 2>/dev/null)" ]; then
            npm install -g allure-commandline@2.29.0
            allure generate build/allure-results -o build/allure-report --clean
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-mobile-kotlin
          path: tests-mobile/kotlin/build/allure-report
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-appium-kotlin-logs
          path: |
            app/app.log
            appium.log
            tests-mobile/kotlin/build/reports/tests
          if-no-files-found: ignore

      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then kill "$(cat appium.pid)" || true; fi

      - name: Stop Spring Boot
        if: always()
        working-directory: app
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi

  publish-allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: appium-kotlin
    timeout-minutes: 45
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-mobile-kotlin
          path: allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure/mobile-kotlin/${{ github.run_number }}
          keep_files: true

      - name: Summary
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/mobile-kotlin/${{ github.run_number }}"
          echo "## Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "- [View Allure Report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
