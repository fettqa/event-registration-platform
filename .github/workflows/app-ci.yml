name: App CI
on:
  push:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/app-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/app-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-app
          path: app/build/allure-results
          if-no-files-found: ignore

      - name: Generate Allure HTML report
        if: always()
        working-directory: app
        run: |
          if [ -d build/allure-results ] && [ "$(ls -A build/allure-results 2>/dev/null)" ]; then
            npm install -g allure-commandline@2.29.0
            allure generate build/allure-results -o build/allure-report --clean
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-app
          path: app/build/allure-report
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test
