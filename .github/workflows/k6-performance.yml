name: k6 Performance

on:
  workflow_call:
    inputs:
      scenario:
        description: 'k6 scenario to run'
        type: string
        required: false
        default: smoke
  workflow_dispatch:
    inputs:
      scenario:
        description: 'k6 scenario to run'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load
          - spike

jobs:
  k6:
    runs-on: ubuntu-latest
    outputs:
      scenario: ${{ steps.run.outputs.scenario }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Download bootJar artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: app-boot-jar
          path: app/build/libs

      - name: Make gradlew executable
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: chmod +x gradlew

      - name: Build bootJar
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Start Spring Boot
        working-directory: app
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app
        working-directory: app
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/actuator/health | grep -q UP; then
              echo "App is UP"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done
          cat app.log || true
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6
        id: run
        env:
          BASE_URL: http://localhost:8080
          SCENARIO: ${{ inputs.scenario || 'smoke' }}
        run: |
          echo "scenario=${SCENARIO}" >> "$GITHUB_OUTPUT"
          case "$SCENARIO" in
            load)  SCRIPT=tests-perf/k6/load-register.js ;;
            spike) SCRIPT=tests-perf/k6/spike.js ;;
            *)     SCRIPT=tests-perf/k6/smoke.js ;;
          esac
          echo "Running $SCRIPT"
          k6 run "$SCRIPT"

      - name: Upload k6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ inputs.scenario || 'smoke' }}
          path: |
            tests-perf/k6/results/*.html
            tests-perf/k6/results/*.json
          if-no-files-found: error

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k6-app-log
          path: app/app.log

  publish-k6-report:
    name: Publish k6 Report
    runs-on: ubuntu-latest
    needs: k6
    timeout-minutes: 90
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
      queue: max
    if: always() && needs.k6.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    steps:
      - name: Download k6 reports
        uses: actions/download-artifact@v4
        with:
          name: k6-report-${{ needs.k6.outputs.scenario || 'smoke' }}
          path: k6-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./k6-report
          destination_dir: k6/${{ needs.k6.outputs.scenario || 'smoke' }}/${{ github.run_number }}
          keep_files: true

      - name: Summary
        run: |
          SCENARIO="${{ needs.k6.outputs.scenario || 'smoke' }}"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/k6/${SCENARIO}/${{ github.run_number }}/${SCENARIO}-report.html"
          echo "## k6 report" >> "$GITHUB_STEP_SUMMARY"
          echo "- [View k6 Report](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
