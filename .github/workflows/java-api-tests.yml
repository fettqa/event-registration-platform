name: Java API Tests (RestAssured)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-api/java/**'
      - '.github/workflows/java-api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tests-api/java/**'
      - '.github/workflows/java-api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x gradlew

      - name: Build app
        working-directory: app
        run: ./gradlew bootJar -x test

      - name: Start Kafka and Mailpit
        working-directory: app
        run: docker compose up -d kafka mailpit

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka is up."
              exit 0
            fi
            sleep 2
          done
          docker compose -f app/docker-compose.yml logs kafka || true
          exit 1

      - name: Wait for Mailpit
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8025/api/v1/info >/dev/null; then
              echo "Mailpit is up."
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Start Spring Boot
        working-directory: app
        env:
          SPRING_PROFILES_ACTIVE: kafka,mail
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        working-directory: app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q UP; then
              exit 0
            fi
            sleep 2
          done
          cat app.log || true
          exit 1

      - name: Make API test gradlew executable
        working-directory: tests-api/java
        run: chmod +x gradlew

      - name: Run RestAssured API tests
        working-directory: tests-api/java
        env:
          BASE_URL: http://localhost:8080
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          MAILPIT_URL: http://localhost:8025
        run: |
          ./gradlew test
          ./gradlew kafkaTest mailTest

      - name: Stop compose
        if: always()
        working-directory: app
        run: docker compose down || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-java-api
          path: tests-api/java/build/allure-results
          if-no-files-found: ignore

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log-java-api
          path: app/app.log
