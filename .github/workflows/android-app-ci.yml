name: Android App CI

on:
  workflow_call:
    inputs:
      run_android_unit:
        description: Run Android unit tests
        type: boolean
        required: false
        default: false
      build_apk:
        description: Build and upload debug APK
        type: boolean
        required: false
        default: false
      run_maestro:
        description: Run Maestro mobile suite
        type: boolean
        required: false
        default: false
      run_appium_python:
        description: Run Appium Python mobile suite
        type: boolean
        required: false
        default: false
      run_appium_kotlin:
        description: Run Appium Kotlin mobile suite
        type: boolean
        required: false
        default: false

jobs:
  android-unit:
    name: Android unit tests
    if: inputs.run_android_unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

  build-apk:
    name: Build debug APK
    if: inputs.build_apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error

  mobile-maestro:
    name: Mobile Maestro
    needs: build-apk
    if: always() && inputs.run_maestro && needs.build-apk.result == 'success'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/mobile-maestro.yml
    secrets: inherit

  mobile-appium-python:
    name: Mobile Appium Python
    needs: build-apk
    if: always() && inputs.run_appium_python && needs.build-apk.result == 'success'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/mobile-appium-python.yml
    secrets: inherit

  mobile-appium-kotlin:
    name: Mobile Appium Kotlin
    needs: build-apk
    if: always() && inputs.run_appium_kotlin && needs.build-apk.result == 'success'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/mobile-appium-kotlin.yml
    secrets: inherit
